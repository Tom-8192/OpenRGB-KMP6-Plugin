name: Release

# A tag like v1.0.1 builds, tests and publishes a release with the plugin files.
# Release notes: docs/releases/<tag>.md (if present), otherwise generated by GitHub.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Tag matches the version in KMP6Plugin.json
        run: |
          grep -q "\"VersionStr\": \"${GITHUB_REF_NAME#v}\"" KMP6Plugin.json || { echo "Tag $GITHUB_REF_NAME does not match KMP6Plugin.json"; exit 1; }
      - name: Install Qt
        run: sudo apt-get update && sudo apt-get install -y qt6-base-dev qmake6
      - name: Test
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -Isrc tests/protocol_test.cpp src/KMP6Protocol.cpp -o protocol_test
          ./protocol_test
      - name: Build
        run: |
          mkdir build && cd build
          qmake6 ../OpenRGB-KMP6.pro CONFIG+=release
          make -j"$(nproc)"
      - name: Package
        run: |
          DIR="OpenRGB-KMP6-${GITHUB_REF_NAME#v}-linux-x64-qt6"
          mkdir "$DIR"
          cp build/libOpenRGB-KMP6.so linux/60-openrgb-kmp6.rules README.md README.de.md LICENSE "$DIR/"
          tar czf "$DIR.tar.gz" "$DIR"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="docs/releases/$GITHUB_REF_NAME.md"
          if [ -f "$NOTES" ]; then ARGS=(--notes-file "$NOTES"); else ARGS=(--generate-notes); fi
          gh release create "$GITHUB_REF_NAME" OpenRGB-KMP6-*.tar.gz --title "OpenRGB KM-P6 plugin $GITHUB_REF_NAME" "${ARGS[@]}"
